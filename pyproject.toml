[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hateblo-posting"
version = "0.1.0"
description = "Hatena Blog AtomPub CLI with Markdown math conversion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["defusedxml>=0.7.1,<1", "keyring>=25.6,<26", "markdown-it-py>=3,<5", "PyYAML>=6.0.2,<7"]

[project.scripts]
hateblo = "hateblo.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/hateblo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
